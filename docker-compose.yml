services:
  postgres:
    # Pinned; the same image the smoke test uses.
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
    ports:
      # Loopback only - never exposed on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 moved the image VOLUME to /var/lib/postgresql
      # (PGDATA is /var/lib/postgresql/18/docker).
      - fleet-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  fleet-pgdata:
