spring:
  application:
    name: fleet-analytics
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/fleet}
    username: ${DB_USER:fleet}
    password: ${DB_PASSWORD:fleet}
  flyway:
    enabled: false   # migrations are applied explicitly (make setup), never on startup

fleet:
  jwt:
    issuer: fleet-analytics
    audience: fleet-analytics-dashboard
    ttl: 15m
    # Configured keys take precedence and are never replaced on failure. Supply BOTH or neither;
    # an unreadable, malformed, undersized or mismatched pair fails startup under every profile.
    private-key-location: ${FLEET_JWT_PRIVATE_KEY:}
    public-key-location: ${FLEET_JWT_PUBLIC_KEY:}
    # Fail closed. Generation additionally requires an allowed profile (dev or test): this flag
    # alone, in any other profile, does nothing and startup fails.
    dev-keys-enabled: ${FLEET_DEV_KEYS:false}

---
spring:
  config:
    activate:
      on-profile: dev
fleet:
  jwt:
    dev-keys-enabled: true
